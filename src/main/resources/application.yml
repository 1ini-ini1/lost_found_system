server:
  port: 8080
  servlet:
    context-path: /
  encoding:
    charset: UTF-8
    enabled: true
    force: true

spring:
  datasource:
    url: jdbc:mysql://120.55.245.101:3307/lost_found?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "@Zzj20061023"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # 适配MySQL 8.x，替换旧方言
        dialect: org.hibernate.dialect.MySQL8Dialect
    database-platform: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false # 关闭懒加载视图，提升性能

# JWT配置
jwt:
  # 新密钥：长度≥64字符，确保安全
  secret: zjutLostFoundSystem20240510SecretKey_WithExtraCharactersToMakeItLonger_AtLeast64Chars
  expiration: 86400000
  issuer: zjut

# 日志配置
logging:
  level:
    root: info
    com.zjut.lost_found: debug
    org.springframework.security: warn
    org.hibernate.SQL: debug # 打印SQL
    org.hibernate.type.descriptor.sql.BasicBinder: trace # 打印SQL参数
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

# SpringDoc Swagger配置（接口文档）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
  packages-to-scan: com.zjut.lost_found.controller