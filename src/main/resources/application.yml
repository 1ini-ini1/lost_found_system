
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lost_found?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root  # 你的MySQL用户名
    password: Zzj20061023  # 你的MySQL密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update  # 自动创建/更新表结构（开发环境用）
    show-sql: true     # 打印执行的SQL（调试用）
    properties:
      hibernate:
        format_sql: true  # 格式化SQL，便于查看
server:
  port: 8080  # 项目端口，访问地址：http://localhost:8080
# SpringDoc OpenAPI配置（解决依赖引入后访问问题）
springdoc:
  api-docs:
    path: /api-docs  # API文档JSON地址
  swagger-ui:
    path: /swagger-ui.html  # 可视化文档访问地址
    operationsSorter: method  # 按请求方法排序接口